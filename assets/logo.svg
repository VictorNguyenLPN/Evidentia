<svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="logoLineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0.75" />
    </linearGradient>
  </defs>
  <!-- Connecting lines with 120-degree symmetry between all 3 branches -->
  <line x1="18" y1="20" x2="18" y2="7.5" stroke="url(#logoLineGrad)" stroke-width="2.2" stroke-linecap="round" />
  <line x1="18" y1="20" x2="7.17" y2="26.25" stroke="url(#logoLineGrad)" stroke-width="2.2" stroke-linecap="round" />
  <line x1="18" y1="20" x2="28.83" y2="26.25" stroke="url(#logoLineGrad)" stroke-width="2.2" stroke-linecap="round" />
  <!-- 4 Equal-sized Circles -->
  <circle cx="18" cy="7.5" r="3.8" fill="url(#logoGradient)" />
  <circle cx="18" cy="20" r="3.8" fill="url(#logoGradient)" />
  <circle cx="7.17" cy="26.25" r="3.8" fill="url(#logoGradient)" />
  <circle cx="28.83" cy="26.25" r="3.8" fill="url(#logoGradient)" />
</svg>