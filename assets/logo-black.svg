<svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="60%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="logoLineGradBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#3f3f46" stop-opacity="0.75" />
    </linearGradient>
  </defs>
  <!-- Connecting lines with 120-degree symmetry between all 3 branches -->
  <line x1="18" y1="20" x2="18" y2="7.5" stroke="url(#logoLineGradBlack)" stroke-width="2.2" stroke-linecap="round" />
  <line x1="18" y1="20" x2="7.17" y2="26.25" stroke="url(#logoLineGradBlack)" stroke-width="2.2" stroke-linecap="round" />
  <line x1="18" y1="20" x2="28.83" y2="26.25" stroke="url(#logoLineGradBlack)" stroke-width="2.2" stroke-linecap="round" />
  <!-- 4 Equal-sized Circles -->
  <circle cx="18" cy="7.5" r="3.8" fill="url(#logoGradBlack)" />
  <circle cx="18" cy="20" r="3.8" fill="url(#logoGradBlack)" />
  <circle cx="7.17" cy="26.25" r="3.8" fill="url(#logoGradBlack)" />
  <circle cx="28.83" cy="26.25" r="3.8" fill="url(#logoGradBlack)" />
</svg>
